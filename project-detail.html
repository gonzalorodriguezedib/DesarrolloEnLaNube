
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Proyecto - InvestMatch</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="dashboard-v2.css">
    <style>
        /* Estilos específicos para la página de detalle */
        .project-detail-layout {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 30px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
            align-items: flex-start;
        }

        .project-main-content img.project-main-image {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 20px;
            object-fit: cover;
            height: 450px;
        }

        .project-main-content h1 {
            font-size: 2.5em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .project-category-tag {
            font-size: 1em;
            font-weight: 500;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .project-description-full {
            font-size: 1.1em;
            line-height: 1.8;
            color: #555;
        }

        body[data-theme='dark'] .project-description-full {
             color: #ccc;
        }

        .investment-sidebar {
            position: sticky;
            top: 40px;
        }

        .investment-box, .creator-box {
            background: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
        }
        
        .investment-box {
            margin-bottom: 30px;
        }

        .investment-box h3, .creator-box h3 {
            font-size: 1.4em;
            margin-bottom: 20px;
        }

        .funding-status p {
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .funding-status .amount {
            font-weight: 600;
            font-size: 1.5em;
            color: var(--primary-color);
        }

        .progress-bar-detail {
            width: 100%;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            margin: 15px 0;
        }

        .progress-bar-detail div {
            height: 100%;
            background-color: var(--primary-color);
            border-radius: 5px;
        }

        .investment-form {
            margin-top: 25px;
        }

        .investment-input-wrapper {
            position: relative;
            margin-bottom: 15px;
        }

        .investment-input-wrapper .currency-symbol {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2em;
            color: #888;
        }

        #investment-amount-input {
            width: 100%;
            padding: 12px 12px 12px 35px;
            font-size: 1.5em;
            font-family: 'Poppins', sans-serif;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-align: right;
            font-weight: 600;
        }

        #invest-button {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            font-weight: 600;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #invest-button:hover {
            background-color: var(--primary-hover);
        }
         #invest-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        #investment-feedback {
            margin-top: 15px;
            font-weight: 500;
            display: none;
        }
        #investment-feedback.success { color: var(--success-color); }
        #investment-feedback.error { color: var(--danger-color); }


        .creator-box { text-align: center; }
        .creator-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; }
        .creator-name { font-weight: 600; }

        @media (max-width: 992px) {
            .project-detail-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header class="simple-header">
         <a href="dashboard-inversor.html" class="logo">InvestMatch</a>
    </header>

    <main id="project-detail-content">
        <!-- El contenido se cargará aquí dinámicamente -->
    </main>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase-config.js"></script>

    <!-- Data y Lógica -->
    <script src="projects.js"></script>
    <script src="project-detail.js"></script>

</body>
</html>
